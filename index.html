
   <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند مدیریت مصرف آب</title>
    <!-- اتصال به Tailwind CSS برای طراحی مدرن -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اتصال به مانیفست PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
</head>
<body class="bg-slate-50 text-slate-800 min-header flex flex-col min-h-screen">

    <!-- هدر سایت -->
    <header class="bg-sky-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">دستیار هوشمند مصرف آب</h1>
        <p class="text-xs text-sky-100 mt-1">سامانه بهینه‌سازی اقلیمی (نسخه خوارزمی)</p>
    </header>

    <!-- بدنه اصلی -->
    <main class="container mx-auto p-4 max-w-md flex-grow">
        
        <!-- فرم ورودی -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h2 class="text-base font-semibold text-slate-700 mb-4">محاسبه‌گر هوشمند نیاز آبی</h2>
            
            <!-- انتخاب نوع کاربری -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">نوع کاربری:</label>
                <select id="userType" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 outline-none text-sm">
                    <option value="home">خانگی (شستشو، فضای سبز منزل)</option>
                    <option value="farm">کشاورزی (مزرعه / باغ)</option>
                </select>
            </div>

            <!-- دمای هوا -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">دمای میانگین هوا (سانتی‌گراد):</label>
                <input type="number" id="tempInput" placeholder="مثلاً 30" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 outline-none text-sm">
            </div>

            <!-- دکمه محاسبه -->
            <button onclick="calculateWater()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium p-3 rounded-xl transition duration-200 shadow-sm text-sm">
                محاسبه و دریافت راهکار
            </button>
        </div>

        <!-- بخش نتیجه -->
        <div id="resultBox" class="hidden bg-sky-50 border border-sky-100 p-4 rounded-2xl mb-6">
            <h3 class="font-bold text-sky-800 text-sm mb-1">نتیجه تحلیل اقلیمی:</h3>
            <p id="resultText" class="text-xs text-sky-900 leading-relaxed"></p>
        </div>

        <!-- بخش تاریخچه محاسبات ذخیره شده -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-semibold text-slate-700">تاریخچه محاسبات اخیر</h3>
                <button onclick="clearHistory()" class="text-xs text-rose-500 hover:underline">پاک کردن تاریخچه</button>
            </div>
            <div id="historyList" class="space-y-2 text-xs text-slate-600">
                <p class="text-slate-400 text-center py-2">هنوز محاسبه‌ای ذخیره نشده است.</p>
            </div>
        </div>

    </main>

    <!-- فوتر -->
    <footer class="text-center p-4 text-xs text-slate-400">
        توسعه داده شده برای ارائه در جشنواره خوارزمی
    ></footer>

    <!-- اسکریپت محاسبات و PWA -->
    <script>
        // ثبت Service Worker برای قابلیت PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('SW Failed', err));
        }

        // بارگذاری تاریخچه هنگام باز شدن صفحه
        window.onload = function() {
            loadHistory();
        };

        function calculateWater() {
            const userType = document.getElementById('userType').value;
            const temp = parseFloat(document.getElementById('tempInput').value);
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (isNaN(temp)) {
                alert('لطفاً دمای معتبری را وارد کنید.');
                return;
            }

            let message = '';
            let waterAmount = 0;

            if (userType === 'home') {
                waterAmount = temp > 35 ? 180 : 130;
                message = `با توجه به دمای ${temp}°C و کاربری خانگی، مصرف بهینه روزانه حدود ${waterAmount} لیتر تخمین زده می‌شود. پیشنهاد: استفاده از سرشیرهای کاهنده جریان و آبیاری باغچه در ساعات پایانی روز.`;
            } else {
                waterAmount = temp > 35 ? 7000 : 4500;
                message = `با توجه به دمای ${temp}°C و کاربری کشاورزی، نیاز آبی هر هکتار حدود ${waterAmount} لیتر در روز است. پیشنهاد: استفاده از سیستم آبیاری قطره‌ای و جلوگیری از تبخیر سطحی.`;
            }

            // نمایش نتیجه
            resultBox.classList.remove('hidden');
            resultText.innerText = message;

            // ذخیره در LocalStorage
            saveToHistory(userType === 'home' ? 'خانگی' : 'کشاورزی', temp, waterAmount);
        }

        function saveToHistory(type, temp, amount) {
            let history = JSON.parse(localStorage.getItem('waterHistory')) || [];
            const newRecord = {
                type: type,
                temp: temp,
                amount: amount,
                date: new Date().toLocaleDateString('fa-IR')
            };

            history.unshift(newRecord); // اضافه کردن به ابتدای آرایه
            if (history.length > 5) history.pop(); // نگه داشتن فقط ۵ مورد آخر

            localStorage.setItem('waterHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('waterHistory')) || [];

            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-slate-400 text-center py-2">هنوز محاسبه‌ای ذخیره نشده است.</p>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach(item => {
                let div = document.createElement('div');
                div.className = 'p-2.5 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center';
                div.innerHTML = `
                    <span>کاربری ${item.type} (دما: ${item.temp}°C)</span>
                    <span class="font-bold text-sky-600">${item.amount} لیتر</span>
                `;
                historyList.appendChild(div);
            });
        }

        function clearHistory() {
            localStorage.removeItem('waterHistory');
            loadHistory();
        }
    </script>
</body>
</html>
